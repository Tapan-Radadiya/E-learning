server {
    listen 80;

    access_log /var/log/nginx/access.log ;


    # Auth Service
    location = /service1/user/get-profile {

        limit_req zone=eLearningRateLimit nodelay;

        if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' 'http://localhost:4000' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }   

        add_header 'Access-Control-Allow-Origin' 'http://localhost:4000' always;
        add_header 'Access-Control-Allow-Credentials' 'true';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;

        access_by_lua_file '/etc/nginx/lua/jwt-auth.lua';

        proxy_pass http://host.docker.internal:3000/user/get-profile;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /service1/ {
        limit_req zone=eLearningRateLimit burst=20 nodelay;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:4000' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }   

        add_header 'Access-Control-Allow-Origin' 'http://localhost:4000' always;
        add_header 'Access-Control-Allow-Credentials' 'true';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
        add_header 'Access-Control-Max-Age' 86400 always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;

        rewrite ^/service1/(.*)$ /$1 break;

        proxy_pass http://host.docker.internal:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ================Course Service

    # Index.m3u8 Streaming File Bypassing this From Auth
    location /service2/course-module/custom-segment-data {

